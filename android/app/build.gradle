apply plugin: 'com.android.application'

android {
    namespace = "com.gainlog.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gainlog.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(
            project.hasProperty('VERSION_CODE') ? project.property('VERSION_CODE') : (System.getenv("VERSION_CODE") ?: "1")
        )
        versionName project.hasProperty('VERSION_NAME') ? project.property('VERSION_NAME') : (System.getenv("VERSION_NAME") ?: "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def resolveKeystore = { String rawPath ->
                if (!rawPath) return null
                def candidate1 = file(rawPath)
                if (candidate1.exists()) return candidate1
                def candidate2 = rootProject.file(rawPath)
                if (candidate2.exists()) return candidate2
                def candidate3 = file("../${rawPath}")
                if (candidate3.exists()) return candidate3
                return null
            }

            def envKeystore = System.getenv("KEYSTORE_PATH")
            def envStorePass = System.getenv("KEYSTORE_PASSWORD")
            def envAlias = System.getenv("KEY_ALIAS")
            def envKeyPass = System.getenv("KEY_PASSWORD")

            def propKeystore = project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE') : null
            def propStorePass = project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : null
            def propAlias = project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : null
            def propKeyPass = project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : null

            if (envKeystore || envStorePass || envAlias || envKeyPass) {
                def ksFile = resolveKeystore(envKeystore)
                if (!ksFile) {
                    throw new GradleException("RELEASE SIGNING ERROR: Environment variable KEYSTORE_PATH='${envKeystore}' file not found.")
                }
                if (!envStorePass || !envAlias || !envKeyPass) {
                    throw new GradleException("RELEASE SIGNING ERROR: All four environment credentials (KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) must be provided together.")
                }
                storeFile ksFile
                storePassword envStorePass
                keyAlias envAlias
                keyPassword envKeyPass
            } else if (propKeystore || propStorePass || propAlias || propKeyPass) {
                def ksFile = resolveKeystore(propKeystore)
                if (!ksFile) {
                    throw new GradleException("RELEASE SIGNING ERROR: Gradle property RELEASE_STORE_FILE='${propKeystore}' file not found.")
                }
                if (!propStorePass || !propAlias || !propKeyPass) {
                    throw new GradleException("RELEASE SIGNING ERROR: All four Gradle properties (RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) must be provided together.")
                }
                storeFile ksFile
                storePassword propStorePass
                keyAlias propAlias
                keyPassword propKeyPass
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Always enforce that any release build task requires valid signing credentials
    gradle.taskGraph.whenReady { taskGraph ->
        boolean isReleaseTaskRequested = taskGraph.allTasks.any { task ->
            task.name.equalsIgnoreCase("bundleRelease") ||
            task.name.equalsIgnoreCase("assembleRelease") ||
            (task.name.toLowerCase().contains("release") && (task.name.toLowerCase().contains("bundle") || task.name.toLowerCase().contains("assemble")))
        }
        if (isReleaseTaskRequested && signingConfigs.release.storeFile == null) {
            throw new GradleException(
                "RELEASE SIGNING ERROR: Building a release artifact requires valid signing credentials.\n" +
                "Please configure either environment variables (KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) " +
                "or Gradle properties (RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)."
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
