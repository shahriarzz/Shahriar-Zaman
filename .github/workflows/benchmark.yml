name: Performance Benchmark Suite

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment label or hardware note recorded in benchmark output'
        required: false
        default: 'manual-dispatch'

jobs:
  benchmark:
    name: Native Vitest Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Performance Benchmarks
        env:
          BENCHMARK_ENV: ${{ github.event.inputs.environment || 'manual-dispatch' }}
        run: |
          set -euo pipefail
          {
            echo "Benchmark Environment: ${BENCHMARK_ENV}"
            echo "Node Version: $(node -v)"
            echo "Runner OS: ${RUNNER_OS:-linux}"
            echo "Timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "----------------------------------------"
          } > benchmark-results.txt
          npm run bench:performance | tee -a benchmark-results.txt
          if [ ! -s benchmark-results.txt ]; then
            echo "benchmark-results.txt is empty" >&2
            exit 1
          fi

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
          if-no-files-found: error
